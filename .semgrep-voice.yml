  - id: ts-concat-temporal-filler
    languages: [typescript]
    severity: ERROR
    message: >-
      A temporal filler phrase reassembled from a `+` chain of literals; the join-tolerant sibling of ts-string-temporal-filler. Merge the literals, or remove the word.
    paths:
      exclude:
        - "**/gen/**"
    patterns:
      - pattern-regex: "(?:\"(?:[^\"\\\\\\n]|\\\\.)*\"|`(?:[^`\\\\]|\\\\.)*`|'(?:[^'\\\\\\n]|\\\\.)*')(?:\\s*\\+\\s*(?:\"(?:[^\"\\\\\\n]|\\\\.)*\"|`(?:[^`\\\\]|\\\\.)*`|'(?:[^'\\\\\\n]|\\\\.)*'))+"
      - pattern-regex: "(?i)(?:r(?:[\"'`]\\s*\\+\\s*[\"'`])?i(?:[\"'`]\\s*\\+\\s*[\"'`])?g(?:[\"'`]\\s*\\+\\s*[\"'`])?h(?:[\"'`]\\s*\\+\\s*[\"'`])?t(?:[\"'`]\\s*\\+\\s*[\"'`])?\\ (?:[\"'`]\\s*\\+\\s*[\"'`])?n(?:[\"'`]\\s*\\+\\s*[\"'`])?o(?:[\"'`]\\s*\\+\\s*[\"'`])?w|a(?:[\"'`]\\s*\\+\\s*[\"'`])?t(?:[\"'`]\\s*\\+\\s*[\"'`])?\\ (?:[\"'`]\\s*\\+\\s*[\"'`])?t(?:[\"'`]\\s*\\+\\s*[\"'`])?h(?:[\"'`]\\s*\\+\\s*[\"'`])?e(?:[\"'`]\\s*\\+\\s*[\"'`])?\\ (?:[\"'`]\\s*\\+\\s*[\"'`])?m(?:[\"'`]\\s*\\+\\s*[\"'`])?o(?:[\"'`]\\s*\\+\\s*[\"'`])?m(?:[\"'`]\\s*\\+\\s*[\"'`])?e(?:[\"'`]\\s*\\+\\s*[\"'`])?n(?:[\"'`]\\s*\\+\\s*[\"'`])?t)"
  - id: ts-concat-first-person
    languages: [typescript]
    severity: ERROR
    message: >-
      First person plural reassembled from a `+` chain of literals; the join-tolerant sibling of ts-string-first-person. The join must fall inside the word's own letters, because an optional join at every position also matches a whole word inside one literal of an unrelated `+` chain. Merge the literals, or remove the word.
    paths:
      exclude:
        - "**/gen/**"
    patterns:
      - pattern-regex: "(?:\"(?:[^\"\\\\\\n]|\\\\.)*\"|`(?:[^`\\\\]|\\\\.)*`|'(?:[^'\\\\\\n]|\\\\.)*')(?:\\s*\\+\\s*(?:\"(?:[^\"\\\\\\n]|\\\\.)*\"|`(?:[^`\\\\]|\\\\.)*`|'(?:[^'\\\\\\n]|\\\\.)*'))+"
      - pattern-regex: "(?i)(?:\\bw[\"'`]\\s*\\+\\s*[\"'`]e\\b|\\bo[\"'`]\\s*\\+\\s*[\"'`]u(?:[\"'`]\\s*\\+\\s*[\"'`])?r\\b|\\bo(?:[\"'`]\\s*\\+\\s*[\"'`])?u[\"'`]\\s*\\+\\s*[\"'`]r\\b|\\bl[\"'`]\\s*\\+\\s*[\"'`]e(?:[\"'`]\\s*\\+\\s*[\"'`])?t(?:[\"'`]\\s*\\+\\s*[\"'`])?\\\\?'(?:[\"'`]\\s*\\+\\s*[\"'`])?s\\b|\\bl(?:[\"'`]\\s*\\+\\s*[\"'`])?e[\"'`]\\s*\\+\\s*[\"'`]t(?:[\"'`]\\s*\\+\\s*[\"'`])?\\\\?'(?:[\"'`]\\s*\\+\\s*[\"'`])?s\\b|\\bl(?:[\"'`]\\s*\\+\\s*[\"'`])?e(?:[\"'`]\\s*\\+\\s*[\"'`])?t[\"'`]\\s*\\+\\s*[\"'`]\\\\?'(?:[\"'`]\\s*\\+\\s*[\"'`])?s\\b|\\bl(?:[\"'`]\\s*\\+\\s*[\"'`])?e(?:[\"'`]\\s*\\+\\s*[\"'`])?t(?:[\"'`]\\s*\\+\\s*[\"'`])?\\\\?'[\"'`]\\s*\\+\\s*[\"'`]s\\b)"
  - id: md-figurative
    languages: [generic]
    severity: ERROR
    message: >-
      Figurative language in markdown prose. AGENTS.md § Voice: it does not resolve literally, so a literal reader stalls on it.
    paths:
      include:
        - "*.md"
    patterns:
      - pattern-regex: '(?mi)^(?!>)(?:[^`"\n]|`[^`\n]*`|"[^"\n]*")*?\b(?:at a glance|under the hood|drill down|deep dive|unlock|powerful|seamless|robust|rich|intuitive|elegant|first-class|out of the box|heavy lifting|source of truth|north star)\b'
  - id: md-purpose-verb
    languages: [generic]
    severity: ERROR
    message: >-
      A purpose verb in markdown prose. AGENTS.md § Voice: say what a thing is, never what it does for the reader.
    paths:
      include:
        - "*.md"
    patterns:
      - pattern-regex: '(?mi)^(?!>)(?:[^`"\n]|`[^`\n]*`|"[^"\n]*")*?\b(?:helps you|lets you|allows you to|makes it easy to|so you can|designed to|built to)\b'
  - id: md-hedge
    languages: [generic]
    severity: ERROR
    message: >-
      A hedge or filler word in markdown prose. AGENTS.md § Voice: cut every word that is not the fact.
    paths:
      include:
        - "*.md"
    patterns:
      - pattern-regex: '(?mi)^(?!>)(?:[^`"\n]|`[^`\n]*`|"[^"\n]*")*?\b(?:simply|essentially|basically|actually|really|quite|fairly|generally|typically|various|appropriate|as needed|please note|of course|note that|in order to|it should be noted)\b'
  - id: md-hedge-just
    languages: [generic]
    severity: ERROR
    message: >-
      "just" as a hedge in markdown prose, not the `just` command-runner name. AGENTS.md § Voice: cut every word that is not the fact.
    paths:
      include:
        - "*.md"
    patterns:
      - pattern-regex: '(?mi)^(?!>)(?!\s*just\b)(?:[^`"\n]|`[^`\n]*`|"[^"\n]*")*?\bjust\b'
  - id: md-temporal-filler
    languages: [generic]
    severity: ERROR
    message: >-
      A temporal filler phrase in markdown prose. AGENTS.md § Voice: every state may change, so this is never the fact -- unless the timing itself is the fact, as in `4m old`.
    paths:
      include:
        - "*.md"
    patterns:
      - pattern-regex: '(?mi)^(?!>)(?:[^`"\n]|`[^`\n]*`|"[^"\n]*")*?\b(?:right now|at the moment|currently)\b'
  - id: md-first-person
    languages: [generic]
    severity: ERROR
    message: >-
      First person plural in markdown prose. AGENTS.md § Voice: no we, no our, no let's.
    paths:
