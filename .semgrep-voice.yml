        - "**/gen/**"
    patterns:
      - pattern-regex: '(?:^|[ \t])//[^\n]*$'
      - pattern-regex: "(?i)\\b(simply|just|essentially|basically|actually|really|quite|fairly|generally|typically|various|appropriate|as needed|please note|of course|note that|in order to|it should be noted)\\b"
  - id: ts-string-temporal-filler
    languages: [typescript]
    severity: ERROR
    message: >-
      A temporal filler phrase in a string or template literal. AGENTS.md § Voice: every state may change, so this is never the fact -- unless the timing itself is the fact, as in `4m old`.
    paths:
      exclude:
        - "**/gen/**"
    patterns:
      - pattern-regex: '(?:"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`|''(?:[^''\\\n]|\\.)*'')'
      - pattern-regex: "(?i)\\b(right now|at the moment|currently)\\b"
