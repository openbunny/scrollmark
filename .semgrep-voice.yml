rules:
  - id: ts-string-figurative
    languages: [typescript]
    severity: ERROR
    message: >-
      Figurative language in a string or template literal. AGENTS.md § Voice: it does not resolve literally, so a literal reader stalls on it.
    paths:
      exclude:
        - "**/gen/**"
    patterns:
      - pattern-regex: '(?:"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`|''(?:[^''\\\n]|\\.)*'')'
      - pattern-regex: "(?i)\\b(at a glance|under the hood|drill down|deep dive|unlock|powerful|seamless|robust|rich|smart|intuitive|elegant|first-class|out of the box|heavy lifting|source of truth|north star)\\b"
  - id: ts-string-purpose-verb
    languages: [typescript]
    severity: ERROR
    message: >-
      A purpose verb in a string or template literal. AGENTS.md § Voice: say what a thing is, never what it does for the reader.
    paths:
      exclude:
        - "**/gen/**"
    patterns:
      - pattern-regex: '(?:"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`|''(?:[^''\\\n]|\\.)*'')'
      - pattern-regex: "(?i)\\b(helps you|lets you|allows you to|enables|makes it easy to|so you can|designed to|built to)\\b"
  - id: ts-string-hedge
    languages: [typescript]
    severity: ERROR
    message: >-
      A hedge or filler word in a string or template literal. AGENTS.md § Voice: cut every word that is not the fact.
    paths:
      exclude:
        - "**/gen/**"
    patterns:
      - pattern-regex: '(?:"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`|''(?:[^''\\\n]|\\.)*'')'
      - pattern-regex: "(?i)\\b(simply|just|essentially|basically|actually|really|quite|fairly|generally|typically|various|appropriate|as needed|please note|of course|note that|in order to|it should be noted)\\b"
  - id: ts-string-first-person
    languages: [typescript]
    severity: ERROR
    message: >-
      First person plural in a string or template literal. AGENTS.md § Voice: no we, no our, no let's.
    paths:
      exclude:
        - "**/gen/**"
    patterns:
      - pattern-regex: '(?:"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`|''(?:[^''\\\n]|\\.)*'')'
      - pattern-regex: "(?i)\\b(we|our|let's)\\b"
  - id: ts-comment-figurative
    languages: [typescript]
    severity: ERROR
    message: >-
      Figurative language in a comment. AGENTS.md § Voice applies to everything a human reads, comments included.
    paths:
      exclude:
        - "**/gen/**"
    patterns:
      - pattern-regex: '(?:^|[ \t])//[^\n]*$'
      - pattern-regex: "(?i)\\b(at a glance|under the hood|drill down|deep dive|unlock|powerful|seamless|robust|rich|smart|intuitive|elegant|first-class|out of the box|heavy lifting|source of truth|north star)\\b"
  - id: ts-comment-purpose-verb
    languages: [typescript]
    severity: ERROR
    message: >-
      A purpose verb in a comment. AGENTS.md § Voice applies to everything a human reads, comments included.
    paths:
      exclude:
        - "**/gen/**"
    patterns:
      - pattern-regex: '(?:^|[ \t])//[^\n]*$'
      - pattern-regex: "(?i)\\b(helps you|lets you|allows you to|enables|makes it easy to|so you can|designed to|built to)\\b"
  - id: ts-comment-hedge
    languages: [typescript]
    severity: ERROR
    message: >-
      A hedge or filler word in a comment. AGENTS.md § Voice applies to everything a human reads, comments included.
    paths:
