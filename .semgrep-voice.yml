        - "*.yaml"
      exclude:
        - ".semgrep-voice.yml"
        - ".semgrep-comments.yml"
    patterns:
      - pattern-regex: "(?mi)^\\s*#(?:[^`\"\\n]|`[^`\\n]*`|\"[^\"\\n]*\")*?\\b(?:at a glance|under the hood|drill down|deep dive|unlock|powerful|seamless|robust|rich|intuitive|elegant|first-class|out of the box|heavy lifting|source of truth|north star|helps you|lets you|allows you to|makes it easy to|so you can|designed to|built to|simply|just|essentially|basically|actually|really|quite|fairly|generally|typically|various|appropriate|as needed|please note|of course|note that|in order to|it should be noted|right now|at the moment|currently|we|our|let's)\\b"
  - id: justfile-comment-authored-voice
    languages: [generic]
    severity: ERROR
    message: >-
      Banned wording in a justfile comment. AGENTS.md § Voice applies to everything a human reads, comments included.
    paths:
      include:
        - "justfile"
    patterns:
      - pattern-regex: "(?mi)^\\s*#(?:[^`\"\\n]|`[^`\\n]*`|\"[^\"\\n]*\")*?\\b(?:at a glance|under the hood|drill down|deep dive|unlock|powerful|seamless|robust|rich|intuitive|elegant|first-class|out of the box|heavy lifting|source of truth|north star|helps you|lets you|allows you to|makes it easy to|so you can|designed to|built to|simply|just|essentially|basically|actually|really|quite|fairly|generally|typically|various|appropriate|as needed|please note|of course|note that|in order to|it should be noted|right now|at the moment|currently|we|our|let's)\\b"
  # A `just`/shell recipe's own `echo`/`printf` argument reaches an operator
  # reading gate output, same standing as an error message in source --
  # unlike the comment rules above, the double-quoted span here *is* the
  # prose to check, not a citation to skip past, so no pairing prefix
  # applies. A single-quoted
  # banner literal (`'\n...just %s...\n'`, the gate-name separator) is
  # unreached by design, since it prints the tool's own name
  # rather than a message.
  - id: shell-message-authored-voice
    languages: [generic]
    severity: ERROR
    message: >-
      Banned wording in an echo/printf message a human reads. AGENTS.md § Voice applies to everything a human reads. "just" is absent from this list: in a justfile or a shell recipe the word names the command runner far more often than it hedges, and the backtick carve-out `md-hedge-just` uses cannot transfer, since a backtick inside a shell string is command substitution. A hedging "just" in one of these messages is caught by review.
    paths:
      include:
        - "*.sh"
        - "justfile"
    patterns:
      - pattern-regex: "(?i)(?:echo|printf)\\s+\"[^\"\\n]*\\b(?:at a glance|under the hood|drill down|deep dive|unlock|powerful|seamless|robust|rich|intuitive|elegant|first-class|out of the box|heavy lifting|source of truth|north star|helps you|lets you|allows you to|makes it easy to|so you can|designed to|built to|simply|essentially|basically|actually|really|quite|fairly|generally|typically|various|appropriate|as needed|please note|of course|note that|in order to|it should be noted|right now|at the moment|currently|we|our|let's)\\b[^\"\\n]*\""
  - id: mjs-comment-authored-voice
    languages: [generic]
    severity: ERROR
    message: >-
      Banned wording in a `.mjs` config comment. AGENTS.md § Voice applies to everything a human reads, comments included.
    paths:
      include:
        - "*.mjs"
    patterns:
      - pattern-regex: "(?mi)^\\s*//(?:[^`\"\\n]|`[^`\\n]*`|\"[^\"\\n]*\")*?\\b(?:at a glance|under the hood|drill down|deep dive|unlock|powerful|seamless|robust|rich|intuitive|elegant|first-class|out of the box|heavy lifting|source of truth|north star|helps you|lets you|allows you to|makes it easy to|so you can|designed to|built to|simply|just|essentially|basically|actually|really|quite|fairly|generally|typically|various|appropriate|as needed|please note|of course|note that|in order to|it should be noted|right now|at the moment|currently|we|our|let's)\\b"
