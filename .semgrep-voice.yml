    patterns:
      - pattern-regex: "(?mi)^(?!>)(?:[^`\"\\n]|`[^`\\n]*`|\"[^\"\\n]*\")*?\\b(?:we|our|let's)\\b"
  - id: yaml-comment-authored-voice
    languages: [generic]
    severity: ERROR
