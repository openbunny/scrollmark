name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write # pushes the release commit and tag
      pull-requests: write # opens and updates the release PR
      issues: write # comments release links on issues the release closes
    uses: openbunny/.github/.github/workflows/reusable-release-please.yml@8a67b83aedd4176c2629ac2cb6c9f53041c23abd # v0.1.0
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
