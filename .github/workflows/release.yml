name: Release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
  security:
    name: Security
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
  gitleaks:
    name: Gitleaks
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-gitleaks.yml@8a67b83aedd4176c2629ac2cb6c9f53041c23abd # v0.1.0
    with:
      version: 8.30.1
  reuse:
    name: REUSE
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-reuse.yml@8a67b83aedd4176c2629ac2cb6c9f53041c23abd # v0.1.0
  tag-version:
    name: Tag matches version
    needs: [ci, security, gitleaks, reuse]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      MISE_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
          install_args: bun
      - run: bun install --frozen-lockfile
      - run: bun run test src/repo.test.ts
  sign-notarize-publish:
    name: Sign, notarize and publish
    needs: [tag-version]
    environment: release
    permissions:
      contents: write # uploads the archive and checksum to the GitHub release
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      MISE_LOCKED: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require release secrets
        env:
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
        run: |
          missing=""
          for name in DEVELOPER_ID_CERTIFICATE_P12 DEVELOPER_ID_CERTIFICATE_PASSWORD DEVELOPMENT_TEAM NOTARY_API_KEY_P8 NOTARY_API_KEY_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Release secrets missing::The release environment has no value for:$missing. Nothing was signed, notarized or published. See RELEASING.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_$(tr -d '[:space:]' < .xcode-version).app"
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
      - run: bun install --frozen-lockfile
      - run: just extension-resources
      - run: xcodegen generate
      - name: Import signing certificate
        env:
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$DEVELOPER_ID_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
      - name: Archive and export with Developer ID Application
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
          </dict>
          </plist>
          PLIST
          xcodebuild archive -project Scrollmark.xcodeproj -scheme Scrollmark -configuration Release \
            -archivePath "$RUNNER_TEMP/Scrollmark.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN_PATH"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Scrollmark.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Notarize
        env:
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          printf '%s' "$NOTARY_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Scrollmark.app" "$RUNNER_TEMP/notarize.zip"
          issuer=()
          [ -z "$NOTARY_API_ISSUER_ID" ] || issuer=(--issuer "$NOTARY_API_ISSUER_ID")
          result=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_API_KEY_ID" "${issuer[@]}" \
            --wait --output-format json)
          echo "$result"
          if [ "$(echo "$result" | jq -r .status)" != "Accepted" ]; then
            echo "::error title=Notarization not accepted::notarytool did not report status Accepted. Nothing was published."
            exit 1
          fi
      - name: Staple and verify
        run: |
          xcrun stapler staple "$RUNNER_TEMP/export/Scrollmark.app"
          xcrun stapler validate "$RUNNER_TEMP/export/Scrollmark.app"
          spctl --assess --type execute --verbose "$RUNNER_TEMP/export/Scrollmark.app"
      - name: Publish archive and checksum
        run: |
          archive="Scrollmark-$RELEASE_TAG.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Scrollmark.app" "$RUNNER_TEMP/$archive"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$archive" > "$archive.sha256")
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP/$archive" "$RUNNER_TEMP/$archive.sha256"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/ExportOptions.plist"
