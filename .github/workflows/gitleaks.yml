name: gitleaks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions: {}
concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    name: Gitleaks
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          cache: false
          install_args: gitleaks
      - name: gitleaks
        run: gitleaks git --redact -v --config .gitleaks.toml
