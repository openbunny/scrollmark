name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-check.yml@2050692900f7dcd883e416ebee37a1b97b119203 # v0.3.0
    with:
      runner: xcode-27
      xcode: "27.0"
      graphics_tools: true
      recipe: ci-check
      timeout-minutes: 45
