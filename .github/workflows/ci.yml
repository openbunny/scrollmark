name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check
    permissions:
      contents: read
    uses: openbunny/.github/.github/workflows/reusable-check.yml@8a67b83aedd4176c2629ac2cb6c9f53041c23abd # v0.1.0
    with:
      runner: macos-26
      xcode: "26.0"
      recipe: ci-check
      timeout-minutes: 45
