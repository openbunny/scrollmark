name: Scrollmark
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  OpenBunnyTheme:
    url: https://github.com/openbunny/theme.git
    revision: 422c5b1cb8cd642324bc39d74079d4cee05dae69
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Signing.xcconfig
  Release: SigningRelease.xcconfig
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    OTHER_SWIFT_FLAGS: -strict-memory-safety
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_APP_SANDBOX: YES
    ENABLE_HARDENED_RUNTIME: YES
    APP_BUNDLE_IDENTIFIER: io.github.openbunny.scrollmark
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Scrollmark:
    type: application
    platform: macOS
    sources:
      - path: App/Sources/App
      - path: App/Sources/Model
      - path: App/Sources/SafariShim
      - path: App/Resources
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Scrollmark
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/SafariShim/Scrollmark-Bridging-Header.h
    dependencies:
      - target: ScrollmarkExtension
        embed: true
      - package: OpenBunnyTheme
        product: OpenBunnyTheme
      - package: OpenBunnyTheme
        product: OpenBunnyUI
    scheme:
      preActions:
        - name: Require signing team
          settingsTarget: Scrollmark
          script: sh "$SRCROOT/Scripts/require-signing-team.sh"
      testTargets:
        - ScrollmarkTests
  ScrollmarkExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension/Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - "**/*.ts"
          - "content"
      - path: Resources/content
        type: folder
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Scrollmark Extension
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).extension
        INFOPLIST_FILE: Extension/Info.plist
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
  ScrollmarkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
      - path: App/Sources/Model
      - path: App/Sources/SafariShim
    dependencies:
      - package: OpenBunnyTheme
        product: OpenBunnyTheme
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/SafariShim/Scrollmark-Bridging-Header.h
